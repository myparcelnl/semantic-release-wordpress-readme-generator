name: 'Release new version 🚀'

on:
  push:
    branches:
      - main

jobs:
  release:
    runs-on: ubuntu-22.04
    permissions:
      id-token: write # npm trusted publishing (OIDC) exchanges this token for a short-lived npm token
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: pnpm/setup@v3
        with:
          cache: true
          require-lockfile: true

      - name: 'Build'
        run: |
          pnpm build

      - uses: myparcelnl/actions/semantic-release@v6
        with:
          token: ${{ secrets.GH_REPO_TOKEN }}
